<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GBUnlockd — Courses</title>
<meta name="description" content="Every course GBUnlockd has. Full price, and what you pay.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;800&display=swap">
<style>
/* Layout: a catalogue index — one rule-separated row per course, price set in
   mono on the right, everything else folded away behind a chevron. */
:root{
  --paper:#F3F1EC; --row:#FFFFFF; --sunk:#E9E5DC;
  --ink:#17150F; --muted:#6E685C; --faint:#A39C8D;
  --rule:#DEDACF; --rule-hard:#C4BCAA;
  --green:#1B5E44; --green-soft:#E1EFE7;
  --gold:#8A6A18;
  --display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --body:'Karla',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121110; --row:#1B1A17; --sunk:#232120;
    --ink:#F2EFE8; --muted:#A49D90; --faint:#6F6961;
    --rule:#2A2825; --rule-hard:#3C3833;
    --green:#5FC295; --green-soft:#16281F;
    --gold:#D9B65C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121110; --row:#1B1A17; --sunk:#232120;
  --ink:#F2EFE8; --muted:#A49D90; --faint:#6F6961;
  --rule:#2A2825; --rule-hard:#3C3833;
  --green:#5FC295; --green-soft:#16281F;
  --gold:#D9B65C;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
img{max-width:100%}
.wrap{max-width:900px; margin:0 auto; padding-inline:16px}

/* ---------- masthead ---------- */
header.mast{padding-block:44px 8px}
.brand{
  font-family:var(--mono); font-size:11px; font-weight:600;
  letter-spacing:.2em; text-transform:uppercase; color:var(--green);
  margin:0 0 14px;
}
h1{
  font-family:var(--display); font-weight:400;
  font-size:clamp(44px,9vw,76px); line-height:.94; letter-spacing:-.02em;
  margin:0 0 16px; text-wrap:balance;
}
h1 em{font-style:italic; color:var(--green)}
.lede{
  margin:0; color:var(--muted); font-size:17px; max-width:54ch;
}
.lede strong{color:var(--ink); font-weight:600}
.tally{
  display:flex; gap:26px; flex-wrap:wrap; margin-top:26px;
  padding-top:20px; border-top:1px solid var(--rule);
}
.tally div{display:flex; flex-direction:column; gap:2px}
.tally dt{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint);
}
.tally dd{
  margin:0; font-family:var(--mono); font-size:21px; font-weight:800;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em;
}
.tally dd.accent{color:var(--green)}

/* ---------- controls ---------- */
.bar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:color-mix(in srgb,var(--paper) 93%,transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--rule); margin-top:30px;
}
.bar-in{
  max-width:900px; margin:0 auto; padding-inline:16px; padding-block:11px;
  display:flex; gap:9px; align-items:center; flex-wrap:wrap;
}
.find{
  flex:1 1 200px; min-width:0; display:flex; align-items:center; gap:8px;
  background:var(--row); border:1px solid var(--rule-hard);
  border-radius:9px; padding:7px 11px;
}
.find svg{flex:none; opacity:.45}
.find input{
  flex:1; min-width:0; border:0; background:none; color:var(--ink);
  font:inherit; font-size:14px; outline:none;
}
.chips{display:flex; gap:6px; flex-wrap:wrap; min-width:0}
.chip{
  font:inherit; font-size:12.5px; font-weight:500; cursor:pointer;
  white-space:nowrap; background:var(--row); color:var(--muted);
  border:1px solid var(--rule-hard); border-radius:99px; padding:5px 13px;
  transition:color .12s, background .12s;
}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
select{
  font:inherit; font-size:12.5px; font-weight:500; color:var(--muted);
  cursor:pointer; background:var(--row); border:1px solid var(--rule-hard);
  border-radius:9px; padding:6px 10px;
}
.shown{
  margin-left:auto; font-family:var(--mono); font-size:11.5px;
  color:var(--faint); font-variant-numeric:tabular-nums; white-space:nowrap;
}

/* ---------- list ---------- */
.list{list-style:none; margin:0; padding:26px 0 8px}
.item{
  background:var(--row); border:1px solid var(--rule);
  border-radius:11px; margin-bottom:9px; overflow:hidden;
}
.item.open{border-color:var(--rule-hard)}
.head{
  width:100%; display:flex; align-items:center; gap:15px;
  padding:15px 16px; background:none; border:0; text-align:left;
  font:inherit; color:inherit; cursor:pointer;
}
.head:hover{background:var(--sunk)}
.head.plain{cursor:default}
.head.plain:hover{background:none}
.main{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px}
.cat{
  font-family:var(--mono); font-size:9.5px; font-weight:600;
  letter-spacing:.15em; text-transform:uppercase; color:var(--muted);
}
.name{
  font-family:var(--display); font-size:22px; line-height:1.15;
  letter-spacing:-.01em; overflow-wrap:anywhere;
}
.tags{display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-top:2px}
.pill{
  font-family:var(--mono); font-size:9.5px; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase;
  border-radius:4px; padding:2px 6px;
  color:var(--green); background:var(--green-soft);
}
.pill.has{color:var(--muted); background:var(--sunk)}
.money{
  flex:none; text-align:right; display:flex; flex-direction:column;
  align-items:flex-end; gap:1px;
}
.was{
  font-family:var(--mono); font-size:12px; color:var(--faint);
  text-decoration:line-through; font-variant-numeric:tabular-nums;
}
.cost{
  font-family:var(--mono); font-size:27px; font-weight:800;
  letter-spacing:-.03em; line-height:1.05; font-variant-numeric:tabular-nums;
}
.costlab{
  font-family:var(--mono); font-size:9px; font-weight:600;
  letter-spacing:.18em; text-transform:uppercase; color:var(--faint);
}
.chev{
  flex:none; width:26px; height:26px; display:grid; place-items:center;
  color:var(--faint); transition:transform .18s ease;
}
.item.open .chev{transform:rotate(180deg); color:var(--ink)}
.more{padding:0 16px 16px; border-top:1px dashed var(--rule); margin-top:-1px}
.more .inner{padding-top:14px; display:flex; flex-direction:column; gap:13px}
.note{margin:0; color:var(--muted); font-size:14.5px; white-space:pre-wrap}
.link{
  align-self:flex-start; font-size:13.5px; font-weight:600;
  color:var(--green); text-decoration:none;
  border-bottom:1.5px solid currentColor; padding-bottom:1px;
  overflow-wrap:anywhere;
}
.link:hover{opacity:.75}

/* ---------- states ---------- */
.state{
  border:1px dashed var(--rule-hard); border-radius:12px;
  padding:52px 24px; text-align:center; color:var(--muted); margin:26px 0;
}
.state h2{
  font-family:var(--display); font-size:26px; font-weight:400;
  margin:0 0 9px; color:var(--ink);
}
.state p{margin:0 auto; max-width:46ch; font-size:14.5px}
.state code{
  font-family:var(--mono); font-size:13px; background:var(--sunk);
  padding:1px 5px; border-radius:4px;
}

footer{
  border-top:1px solid var(--rule); margin-top:26px;
  padding-block:20px 48px; color:var(--faint); font-size:13px;
}
footer p{margin:0 0 6px}
:focus-visible{outline:2px solid var(--green); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){
  .head{gap:11px; padding:13px 13px}
  .name{font-size:19px}
  .cost{font-size:23px}
  .tally{gap:18px}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="mast">
    <p class="brand">GBUnlockd</p>
    <h1>Every course<br>we <em>already have</em>.</h1>
    <p class="lede">These are done deals — bought, paid for and sitting ready. You pay the <strong>COST</strong> price, not the full one. Open a ticket to get one.</p>
    <dl class="tally" id="tally"></dl>
  </header>
</div>

<div class="bar">
  <div class="bar-in">
    <label class="find" for="q">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="q" type="search" placeholder="Search" autocomplete="off">
    </label>
    <div class="chips" id="cats"></div>
    <select id="sort" aria-label="Sort">
      <option value="az">A – Z</option>
      <option value="cheap">Cheapest</option>
      <option value="save">Biggest saving</option>
      <option value="dear">Most expensive</option>
    </select>
    <span class="shown" id="shown"></span>
  </div>
</div>

<div class="wrap">
  <ul class="list" id="list"></ul>
  <div class="state" id="state" hidden>
    <h2>Loading…</h2>
    <p>One moment.</p>
  </div>
  <footer>
    <p>Prices in USD. The COST price is what you pay us.</p>
    <p id="stamp"></p>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var listEl  = document.getElementById("list");
  var stateEl = document.getElementById("state");
  var catsEl  = document.getElementById("cats");
  var qEl     = document.getElementById("q");
  var sortEl  = document.getElementById("sort");
  var shownEl = document.getElementById("shown");
  var tallyEl = document.getElementById("tally");
  var stampEl = document.getElementById("stamp");

  var all = [];
  var cat = "All";

  function money(n) {
    if (!(n > 0)) return "—";
    return "$" + n.toLocaleString("en-US", {
      minimumFractionDigits: (n % 1 ? 2 : 0), maximumFractionDigits: 2
    });
  }
  function saving(c) {
    if (!(c.full > 0) || !(c.cost >= 0)) return null;
    if (c.cost >= c.full) return null;
    return 1 - c.cost / c.full;
  }
  function safeUrl(u) {
    if (!u) return "";
    try {
      var p = new URL(String(u).trim());
      return (p.protocol === "https:" || p.protocol === "http:") ? p.href : "";
    } catch (e) { return ""; }
  }
  function showState(title, body, htmlBody) {
    listEl.hidden = true;
    stateEl.hidden = false;
    stateEl.innerHTML = "";
    var h = document.createElement("h2"); h.textContent = title;
    var p = document.createElement("p");
    if (htmlBody) p.innerHTML = htmlBody; else p.textContent = body;
    stateEl.appendChild(h); stateEl.appendChild(p);
  }

  function summary() {
    var n = all.length;
    var full = 0, cost = 0;
    all.forEach(function (c) { full += (c.full > 0 ? c.full : 0); cost += (c.cost > 0 ? c.cost : 0); });
    var pct = full > 0 ? Math.round((1 - cost / full) * 100) : 0;
    tallyEl.innerHTML = "";
    [
      ["Courses", String(n), false],
      ["Full price", money(full), false],
      ["You would pay", money(cost), true],
      ["That is", pct + "% off", true]
    ].forEach(function (r) {
      if (r[1] === "—") return;
      var d  = document.createElement("div");
      var dt = document.createElement("dt"); dt.textContent = r[0];
      var dd = document.createElement("dd"); dd.textContent = r[1];
      if (r[2]) dd.className = "accent";
      d.appendChild(dt); d.appendChild(dd); tallyEl.appendChild(d);
    });
  }

  function visible() {
    var q = qEl.value.trim().toLowerCase();
    var out = all.filter(function (c) {
      if (cat !== "All" && (c.category || "Other") !== cat) return false;
      if (!q) return true;
      return ((c.name || "") + " " + (c.category || "") + " " + (c.note || ""))
        .toLowerCase().indexOf(q) !== -1;
    });
    var by = sortEl.value;
    out.sort(function (a, b) {
      if (by === "cheap") return (a.cost || 0) - (b.cost || 0);
      if (by === "dear")  return (b.cost || 0) - (a.cost || 0);
      if (by === "save")  return (saving(b) || 0) - (saving(a) || 0);
      return (a.name || "").localeCompare(b.name || "");
    });
    return out;
  }

  function row(c, i) {
    var url = safeUrl(c.link);
    var hasMore = !!(url || (c.note && c.note.trim()));
    var li = document.createElement("li");
    li.className = "item";

    var head = document.createElement(hasMore ? "button" : "div");
    head.className = "head" + (hasMore ? "" : " plain");
    if (hasMore) {
      head.type = "button";
      head.setAttribute("aria-expanded", "false");
      head.setAttribute("aria-controls", "more-" + i);
    }

    var main = document.createElement("div"); main.className = "main";
    if (c.category) {
      var k = document.createElement("span"); k.className = "cat";
      k.textContent = c.category; main.appendChild(k);
    }
    var nm = document.createElement("span"); nm.className = "name";
    nm.textContent = c.name || "Untitled"; main.appendChild(nm);

    var s = saving(c);
    var tags = document.createElement("div"); tags.className = "tags";
    if (s !== null && s > 0.005) {
      var p1 = document.createElement("span"); p1.className = "pill";
      p1.textContent = "Save " + Math.round(s * 100) + "%"; tags.appendChild(p1);
    }
    if (hasMore) {
      var p2 = document.createElement("span"); p2.className = "pill has";
      p2.textContent = (url && c.note) ? "Link + notes" : (url ? "Link" : "Notes");
      tags.appendChild(p2);
    }
    if (tags.children.length) main.appendChild(tags);
    head.appendChild(main);

    var mon = document.createElement("div"); mon.className = "money";
    if (c.full > 0 && c.cost < c.full) {
      var w = document.createElement("span"); w.className = "was";
      w.textContent = money(c.full); mon.appendChild(w);
    }
    var cst = document.createElement("span"); cst.className = "cost";
    cst.textContent = money(c.cost); mon.appendChild(cst);
    var cl = document.createElement("span"); cl.className = "costlab";
    cl.textContent = "cost"; mon.appendChild(cl);
    head.appendChild(mon);

    if (hasMore) {
      var ch = document.createElement("span"); ch.className = "chev";
      ch.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
      head.appendChild(ch);
    }
    li.appendChild(head);

    if (hasMore) {
      var more = document.createElement("div");
      more.className = "more"; more.id = "more-" + i; more.hidden = true;
      var inner = document.createElement("div"); inner.className = "inner";
      if (c.note && c.note.trim()) {
        var n = document.createElement("p"); n.className = "note";
        n.textContent = c.note.trim(); inner.appendChild(n);
      }
      if (url) {
        var a = document.createElement("a"); a.className = "link";
        a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
        a.textContent = "See what is in it →"; inner.appendChild(a);
      }
      more.appendChild(inner); li.appendChild(more);

      head.addEventListener("click", function () {
        var open = li.classList.toggle("open");
        more.hidden = !open;
        head.setAttribute("aria-expanded", String(open));
      });
    }
    return li;
  }

  function render() {
    var seen = {};
    all.forEach(function (c) { if (c.category) seen[c.category] = 1; });
    var names = ["All"].concat(Object.keys(seen).sort());
    if (names.indexOf(cat) === -1) cat = "All";
    catsEl.innerHTML = "";
    if (names.length > 1) {
      names.forEach(function (n) {
        var b = document.createElement("button");
        b.className = "chip"; b.type = "button"; b.textContent = n;
        b.setAttribute("aria-pressed", String(n === cat));
        b.addEventListener("click", function () { cat = n; render(); });
        catsEl.appendChild(b);
      });
    }

    var list = visible();
    shownEl.textContent = list.length + (list.length === 1 ? " course" : " courses");

    if (!list.length) {
      showState("Nothing matches", "Clear the search, or pick another category.");
      return;
    }
    stateEl.hidden = true;
    listEl.hidden = false;
    listEl.innerHTML = "";
    list.forEach(function (c, i) { listEl.appendChild(row(c, i)); });
  }

  qEl.addEventListener("input", render);
  sortEl.addEventListener("change", render);

  // ---------- load ----------
  showState("Loading…", "One moment.");

  fetch("courses.json", { cache: "no-cache" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      var raw = Array.isArray(data) ? data : (data && data.courses) || [];
      all = raw.map(function (c) {
        return {
          name: String(c.name || "").trim(),
          category: String(c.category || "").trim(),
          full: Number(c.full) || 0,
          cost: Number(c.cost) || 0,
          link: c.link || "",
          note: c.note || ""
        };
      }).filter(function (c) { return c.name; });

      if (data && data.updated) {
        stampEl.textContent = "List last updated " + String(data.updated) + ".";
      }
      if (!all.length) {
        summary();
        showState("Nothing on the list yet",
          "Add courses to courses.json and they show up here.");
        return;
      }
      summary();
      render();
    })
    .catch(function () {
      showState("The list could not load", "",
        'If you are opening this file from your computer, that is why — the list only loads from a real web address. ' +
        'On the live site, check that <code>courses.json</code> sits next to <code>index.html</code> and that the JSON is valid.');
    });
})();
</script>
</body>
</html>
